<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Segment Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ asset('css/style.css') }}">
</head>
<body class="login-body">

<div class="grain"></div>

<main class="login-shell">
  <div class="login-card">
    <div class="brand login-brand">
      <span class="brand-mark">◆</span>
      <div class="brand-text">
        <span class="brand-title">Segment Atlas</span>
        <span class="brand-sub">Understand your mall shoppers at a glance</span>
      </div>
    </div>

    <h1 class="login-title">Welcome back</h1>
    <p class="login-desc">Sign in to explore your mall's customer groups.</p>

    {% if error %}
    <p class="login-error">{{ error }}</p>
    {% endif %}

    <form class="login-form" method="POST" action="{{ url_for('login') }}">
      <label class="field">
        <span class="field-label">Username</span>
        <input type="text" name="username" class="login-input" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" class="login-input" autocomplete="current-password" required>
      </label>
      <button type="submit" class="predict-btn login-btn">Sign in</button>
    </form>

    <p class="login-hint">Try it out with <code>{{ demo_username }}</code> / <code>mall2026</code></p>
  </div>
</main>

</body>
</html>
